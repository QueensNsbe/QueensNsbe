# Decap CMS configuration.
# Full reference: https://decapcms.org/docs/configuration-options/
#
# "backend" tells Decap how to authenticate and where to commit changes.
# git-gateway routes through Netlify Identity, so we never expose a GitHub
# token in the browser — Netlify handles the actual GitHub API calls.
backend:
  name: git-gateway
  branch: main

# Where uploaded images get committed, and what URL path Astro should use
# to reference them once built.
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# Shows a "Published"/"Draft" workflow (adds a review step before merging
# to main) instead of committing straight to main. Turn on if execs want a
# review step before content goes live.
# publish_mode: editorial_workflow

collections:
  # "pages" is a file collection: a fixed list of single, named files —
  # used for the singleton pages (About, Contact, Mentorship) rather than
  # an open-ended folder of many entries.
  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        label: "About Page"
        file: "src/content/pages/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "SEO Description", name: "seoDescription", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "contact"
        label: "Contact Page"
        file: "src/content/pages/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "SEO Description", name: "seoDescription", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "mentorship"
        label: "Mentorship Page"
        file: "src/content/pages/mentorship.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "SEO Description", name: "seoDescription", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }

  # "events" is a folder collection: each entry is its own Markdown file in
  # src/content/events/. "create: true" lets execs add new events from the UI.
  - name: "events"
    label: "Events"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Time", name: "time", widget: "string", required: false, hint: "e.g. 6:00 PM" }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "RSVP Link", name: "rsvpLink", widget: "string", required: false, hint: "Full URL, e.g. an Eventbrite or Google Form link" }
      - { label: "Description", name: "body", widget: "markdown", required: false }

  # "exec" is a folder collection: one Markdown file per exec/department member.
  - name: "exec"
    label: "Exec Team"
    folder: "src/content/exec"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string", hint: "e.g. President, VP Events" }
      - { label: "Department", name: "department", widget: "string", required: false }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - { label: "Email", name: "email", widget: "string", required: false }
      - { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false }
      - { label: "Sort Order", name: "order", widget: "number", default: 0, hint: "Lower numbers show first" }

  # "blog" is a folder collection for announcements/posts.
  - name: "blog"
    label: "Blog / Announcements"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Author", name: "author", widget: "string", required: false }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "string", required: false, hint: "Short summary shown on the blog listing page" }
      - { label: "Body", name: "body", widget: "markdown" }
